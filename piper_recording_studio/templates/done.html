<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="Contribute your voice to open source">
        <meta name="author" content="Michael Hansen">

        <link href="css/bootstrap.min.css" rel="stylesheet">
        <link href="css/fontawesome-all.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-md bg-light">
                <a href="/">
                    <img id="logo" src="img/logo.png" alt="Piper logo" style="height: 3em;" />
                </a>
            </nav>
        </header>
        <div class="container-fluid mt-3">
            <div class="row-fluid">
                <div id="alert" class="alert alert-success">All done, thank you!</div>
            </div>
            {% if language: %}
            <div class="row-fluid mt-3">
                <form method="get" action="train">
                    <input type="hidden" name="language" value="{{ language }}">
                    <input type="hidden" name="userId" value="{{ user_id }}">
                    <button type="submit" class="btn btn-lg btn-success">
                        <i class="fas fa-cogs mr-1"></i>
                        Train Voice
                    </button>
                </form>
            </div>
            {% endif %}
        </div>
    </body>
</html>
